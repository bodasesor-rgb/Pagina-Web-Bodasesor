    <script>
      (function () {
        var p = location.pathname.replace(/\/+$/, '') || '/';

        var segments = p.split('/').filter(Boolean);
        var isHome = p === '/' || (segments.length === 1 && cities.indexOf(',' + segments[0] + ',') >= 0);
        window.__BS_HOME_LCP = isHome;
        if (!isHome) {
          document.documentElement.classList.add('no-lcp-hero');
        } else {
          // Only preload home hero on home/city landings — never on /banquetes-catering etc.
          var m = document.createElement('link');

          m.href = '/images/hero-bg-new-mobile.webp';
          m.media = '(max-width: 768px)';
          m.fetchPriority = 'high';
          document.head.appendChild(m);
          var d = document.createElement('link');
          d.rel = 'preload'; d.as = 'image'; d.type = 'image/webp';
          d.href = '/images/hero-bg-new.webp';
          d.media = '(min-width: 769px)';
          d.fetchPriority = 'high';
          document.head.appendChild(d);
        }
        if (/^\/(products|collections|blogs|pages)\//.test(p)) {
          var s = document.createElement('script');
          s.src = '/legacy-redirect-boot.js';
          document.head.appendChild(s);
          return;
        }
        // Glued city: last segment ends with a city slug but is longer (e.g. carpasmorelia)
        var last = p.split('/').pop() || '';
        var cityList = ['ciudad-de-mexico','estado-de-mexico','san-miguel-allende','san-luis-potosi','puerto-vallarta','valle-de-bravo','aguascalientes','guadalajara','cuernavaca','monterrey','los-cabos','acapulco','cancun','cozumel','morelia','queretaro','pachuca','tijuana','torreon','veracruz','vallarta','oaxaca','merida','puebla','toluca','cdmx','leon'];
